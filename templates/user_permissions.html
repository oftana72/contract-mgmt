{% extends "base.html" %}
{% block title %}Permissions - {{ user.username }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-shield-lock"></i> Permissions: {{ user.username }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        {% for p in all_permissions %}
                        <div class="form-check">
                            <input type="checkbox" name="permissions" value="{{ p.id }}" class="form-check-input"
                                id="perm{{ p.id }}" {{ 'checked' if p.id in user_perm_ids }}>
                            <label class="form-check-label" for="perm{{ p.id }}">{{ p.name }}</label>
                        </div>
                        {% endfor %}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Save</button>
                        <a href="{{ url_for('users_list') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
